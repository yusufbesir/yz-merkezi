<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sahte site - ChatGPT</title>
<!-- Testler için ChatGPT'yi taklit eden yerel sayfa. Uygulama sunucusu bunu yalnızca YZ_TEST=1 iken sunar. -->
<link rel="stylesheet" href="/test/sahte-site.css">
</head>
<body>
<nav>
  <a href="/test/c/1">Birinci sohbet</a>
  <a href="/test/c/2">İkinci sohbet</a>
  <a href="/test/c/3">Üçüncü sohbet</a>
  <!-- Yanlış forma gönderimi yakalamak için: sayfada ikinci bir form, textarea ve submit düğmesi. -->
  <form id="geri-bildirim">
    <label for="geri-bildirim-metin">Geri bildirim</label>
    <textarea id="geri-bildirim-metin" name="geri-bildirim"></textarea>
    <button type="submit" aria-label="Submit feedback">Gönder</button>
    <span id="geri-bildirim-durum" data-gonderilen="0"></span>
  </form>
</nav>
<main>
  <div id="sohbet"></div>
  <form id="alt">
    <div id="prompt-textarea" contenteditable="true" role="textbox"></div>
    <button type="submit" data-testid="send-button" aria-label="Send prompt" disabled>↑</button>
  </form>
</main>
<script src="/test/sahte-site.js"></script>
</body>
</html>
