<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sahte site - ChatGPT</title>
<!-- Testler için ChatGPT'yi taklit eden yerel sayfa. Uygulama sunucusu bunu yalnızca YZ_TEST=1 iken sunar. -->
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: #fff; color: #222; }
  nav { width: 220px; padding: 12px; background: #f4f4f4; display: flex; flex-direction: column; gap: 6px; }
  nav a { color: inherit; text-decoration: none; padding: 6px 8px; border-radius: 6px; }
  nav a[aria-current="page"] { background: #dcdcdc; }
  main { flex: 1; display: flex; flex-direction: column; padding: 12px 24px; min-width: 0; }
  #sohbet { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  [data-message-author-role] { white-space: pre-wrap; padding: 8px 12px; border-radius: 10px; max-width: 70%; }
  [data-message-author-role="user"] { align-self: flex-end; background: #ececec; }
  [data-message-author-role="assistant"] { align-self: flex-start; }
  #alt { display: flex; gap: 8px; align-items: flex-end; border: 1px solid #ccc; border-radius: 14px; padding: 8px; }
  #prompt-textarea { flex: 1; min-height: 24px; max-height: 160px; overflow-y: auto; outline: none; white-space: pre-wrap; }
  button { border: none; border-radius: 50%; width: 32px; height: 32px; background: #000; color: #fff; cursor: pointer; }
  button:disabled { opacity: .3; cursor: default; }
</style>
</head>
<body>
<nav>
  <a href="/test/c/1">Birinci sohbet</a>
  <a href="/test/c/2">İkinci sohbet</a>
  <a href="/test/c/3">Üçüncü sohbet</a>
</nav>
<main>
  <div id="sohbet"></div>
  <div id="alt">
    <div id="prompt-textarea" contenteditable="true" role="textbox"></div>
    <button data-testid="send-button" aria-label="Send prompt" disabled>↑</button>
  </div>
</main>
<script>
  const sohbet = document.getElementById("sohbet");
  const kutu = document.getElementById("prompt-textarea");
  const dugme = document.querySelector('[data-testid="send-button"]');

  function mesajEkle(rol, metin) {
    const e = document.createElement("div");
    e.setAttribute("data-message-author-role", rol);
    e.textContent = metin;
    sohbet.appendChild(e);
    sohbet.scrollTop = sohbet.scrollHeight;
  }

  // /test/c/<kimlik> adresinde hazır bir sohbet (bir soru, bir yanıt) yüklenir.
  const eslesme = /\/c\/([^/?#]+)/.exec(location.pathname);
  if (eslesme) {
    mesajEkle("user", "Soru " + eslesme[1]);
    mesajEkle("assistant", "Yanıt " + eslesme[1]);
    const bag = document.querySelector('nav a[href$="/c/' + eslesme[1] + '"]');
    if (bag) { bag.setAttribute("aria-current", "page"); }
  }

  function yolla() {
    const metin = kutu.innerText.trim();
    if (!metin) { return; }
    mesajEkle("user", metin);
    kutu.innerText = "";
    dugme.disabled = true;
    const durdur = document.createElement("button");
    durdur.setAttribute("aria-label", "Stop");
    durdur.textContent = "■";
    document.getElementById("alt").appendChild(durdur);
    setTimeout(() => {
      mesajEkle("assistant", "Yanıt: " + metin);
      durdur.remove();
    }, 1000);
  }

  kutu.addEventListener("input", () => { dugme.disabled = kutu.innerText.trim() === ""; });
  kutu.addEventListener("keydown", (o) => {
    if (o.key === "Enter" && !o.shiftKey) { o.preventDefault(); yolla(); }
  });
  dugme.addEventListener("click", yolla);
</script>
</body>
</html>
